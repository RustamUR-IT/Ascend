name: Build Ascend APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Ascend.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-apk
          path: Ascend.apk

      # Publishes the APK so it can be downloaded on the phone from
      # https://github.com/<owner>/<repo>/releases/latest/download/Ascend.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Ascend.apk \
            --title "Ascend · build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download Ascend.apk below and open it on your phone." \
            --latest
